<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InfoLink - Excel Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="shared.css"/>
  <style>
    /* Converter styling integrated with shared design system */
    .converter-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
      max-width: 540px;
      margin: 0 auto 24px auto;
      text-align: center;
    }

    .icon-badge {
      width: 56px;
      height: 56px;
      background: rgba(124, 58, 237, 0.12);
      color: var(--accent);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 1.5rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-field {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .input-wrap input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      padding: 10px 12px 10px 36px;
      outline: none;
      transition: border-color 0.18s;
    }

    .input-wrap input:focus {
      border-color: var(--accent);
    }

    .upload-box {
      border: 2px dashed var(--border);
      background: var(--bg-input);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 20px;
      text-align: center;
      transition: border-color 0.18s;
    }

    .upload-box:hover {
      border-color: var(--accent);
    }

    .upload-icon {
      font-size: 1.6rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .upload-box p {
      font-size: 0.88rem;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .upload-box small {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .btn-choose {
      margin-top: 14px;
    }

    #status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    #downloadSection {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .divider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
<div class="app">

  <!-- -- SIDEBAR -- -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="infolink-logo.png" alt="InfoLink" class="sidebar-logo-img" style="height:38px;object-fit:contain;max-width:160px;">
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Injected by JS -->
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar" id="sb-avatar">A</div>
      <div class="user-info">
        <div class="user-name" id="sb-name">Admin</div>
        <div class="user-role" id="sb-role">System Administrator</div>
      </div>
    </div>
    <div style="padding:0 14px 14px;">
      <button class="btn-logout" id="logoutBtn" onclick="handleLogout()">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- -- MAIN -- -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-title">
        <h2 id="top-title">Excel Converter</h2>
        <p id="top-subtitle">Convert a spreadsheet from a file path or upload</p>
      </div>
      <div class="topbar-actions">
        <button class="theme-btn" id="themeButton" title="Toggle theme">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <div class="profile-chip">
          <div class="avatar" id="top-avatar">A</div>
          <div>
            <div class="name" id="top-name">Admin</div>
            <div class="role" id="top-role">System Administrator</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <section class="converter-card card">
        <div class="icon-badge">
          <i class="fa-solid fa-file-excel"></i>
        </div>

        <div class="card-title">Convert your file</div>
        <div class="card-subtitle">Provide a file path, or upload a file directly.</div>

        <div class="form-field">
          <label>Excel file path</label>
          <div class="input-wrap">
            <i class="fa-solid fa-folder-open"></i>
            <input type="text" id="filePath" placeholder="Enter Excel file path">
          </div>
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="convertFile()">Convert File</button>

        <div class="divider-row">
          <div class="divider-line"></div>
          OR
          <div class="divider-line"></div>
        </div>

        <div class="upload-box">
          <div class="upload-icon"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
          <p>Drag &amp; drop your file here</p>
          <small>Supports CSV, XLSX</small>
          <br><br>
          <input type="file" id="archiveFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFileSelect(this)">
          <button class="btn btn-outline btn-choose" type="button" onclick="document.getElementById('archiveFile').click()">
            <i class="fa-solid fa-folder"></i> &nbsp; Choose File
          </button>
          <p id="archiveName" style="margin-top:12px; color:var(--text-secondary); font-size:0.75rem;">No file chosen</p>
        </div>

        <button class="btn btn-primary" style="width:100%" onclick="uploadArchive()">Upload &amp; Convert</button>

        <p id="status"></p>

        <div id="downloadSection" style="display:none">
          <div class="icon-badge" style="background:rgba(16,185,129,0.15); color:var(--success)">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <div class="card-title">Your file is ready</div>
          <div class="card-subtitle" id="downloadFileName" style="margin-bottom:18px">converted-file.csv</div>
          <button class="btn btn-success" id="downloadBtn" type="button" style="width:100%">
            <i class="fa-solid fa-download"></i> &nbsp; Download File
          </button>
        </div>
      </section>
    </main>

  </div>
</div>

<script src="data-store.js"></script>
<script>
  // Auth guard
  if (!InfoLinkStore.isLoggedIn()) {
    window.location.href = 'login.html';
  }

  const currentUser = InfoLinkStore.getCurrentUser();
  const isAdmin     = InfoLinkStore.isAdmin();
  const displayName = currentUser.fullname || currentUser.username || 'User';
  const displayRole = isAdmin ? 'System Administrator' : 'Standard User';
  const displayInit = displayName.charAt(0).toUpperCase();

  // Set user info
  document.getElementById('sb-avatar').textContent   = displayInit;
  document.getElementById('sb-name').textContent     = displayName;
  document.getElementById('sb-role').textContent     = displayRole;
  document.getElementById('top-avatar').textContent  = displayInit;
  document.getElementById('top-name').textContent    = displayName;
  document.getElementById('top-role').textContent    = displayRole;

  // Build adaptive sidebar nav
  const adminNav = `
    <div class="nav-section-label">Main</div>
    <a href="dashboard.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="search-admin.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Search
    </a>
    <div class="nav-section-label">Management</div>
    <a href="users.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Users
    </a>
    <a href="groups.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      Groups
    </a>
    <a href="logs.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Logs
    </a>
    <div class="nav-section-label">Settings</div>
    <a href="change-password.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Change Password
    </a>
    <div class="nav-section-label">Tools</div>
    <a href="processor.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="17" width="18" height="4" rx="1"/><line x1="7" y1="5" x2="17" y2="5"/><line x1="7" y1="12" x2="14" y2="12"/></svg>
      Column Mapping
    </a>
    <a href="convert.html" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      Converter
    </a>
  `;

  const userNav = `
    <div class="nav-section-label">Main</div>
    <a href="dashboard-user.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="search-user.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Search
    </a>
    <div class="nav-section-label">Settings</div>
    <a href="change-password.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Change Password
    </a>
    <div class="nav-section-label">Tools</div>
    <a href="processor.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="17" width="18" height="4" rx="1"/><line x1="7" y1="5" x2="17" y2="5"/><line x1="7" y1="12" x2="14" y2="12"/></svg>
      Column Mapping
    </a>
    <a href="convert.html" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      Converter
    </a>
  `;

  document.getElementById('sidebar-nav').innerHTML = isAdmin ? adminNav : userNav;

  function handleLogout() {
    InfoLinkStore.clearSession();
    window.location.href = 'login.html';
  }

  // File Converter Logic
  let lastResultName = "converted-file.csv";

  function convertFile() {
    const path = document.getElementById("filePath").value.trim();
    const status = document.getElementById("status");
    const downloadSection = document.getElementById("downloadSection");

    if (!path) {
      status.style.color = "var(--danger)";
      status.textContent = "Please enter a file path.";
      downloadSection.style.display = "none";
      return;
    }

    status.style.color = "var(--text-muted)";
    status.textContent = "Converting " + path + " ...";
    downloadSection.style.display = "none";

    const baseName = path.split(/[\\/]/).pop().replace(/\.[^/.]+$/, "") || "converted-file";
    lastResultName = baseName + "-converted.csv";

    setTimeout(() => {
      status.style.color = "var(--success)";
      status.textContent = "Conversion complete.";
      document.getElementById("downloadFileName").textContent = lastResultName;
      downloadSection.style.display = "block";
    }, 600);
  }

  function handleFileSelect(input) {
    const label = document.getElementById('archiveName');
    if (input.files && input.files[0]) {
      label.textContent = input.files[0].name;
    } else {
      label.textContent = "No file chosen";
    }
  }

  function uploadArchive() {
    const input = document.getElementById("archiveFile");
    const status = document.getElementById("status");
    const downloadSection = document.getElementById("downloadSection");

    if (!input.files.length) {
      status.style.color = "var(--danger)";
      status.textContent = "Please choose a file to upload.";
      downloadSection.style.display = "none";
      return;
    }

    const file = input.files[0];
    status.style.color = "var(--text-muted)";
    status.textContent = "Uploading " + file.name + " ...";
    downloadSection.style.display = "none";

    const baseName = file.name.replace(/\.[^/.]+$/, "") || "converted-file";
    lastResultName = baseName + "-converted.csv";

    setTimeout(() => {
      status.style.color = "var(--success)";
      status.textContent = "Upload and conversion complete.";
      document.getElementById("downloadFileName").textContent = lastResultName;
      downloadSection.style.display = "block";
    }, 600);
  }

  document.getElementById("downloadBtn").addEventListener("click", function () {
    const csvContent = "Name,Number,Address,Branch,Area,Date\n";
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = lastResultName;
    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
  });

  // Toggle theme button
  document.getElementById("themeButton").addEventListener("click", function () {
    document.body.classList.toggle("light-mode");
  });
</script>
<script src="3d-effects.js"></script>
</body>
</html>
