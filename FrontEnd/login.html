<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InfoLink – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #080c14;
      --bg-card: #0d1422;
      --bg-input: #111827;
      --border: #1e2d45;
      --border-focus: #7c3aed;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow: rgba(124,58,237,0.35);
      --text-primary: #e2e8f0;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: float 8s ease-in-out infinite;
    }
    .blob-1 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #7c3aed, #4f46e5);
      top: -120px; right: -80px;
      animation-delay: 0s;
    }
    .blob-2 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, #1e40af, #0ea5e9);
      bottom: -100px; left: -60px;
      animation-delay: 3s;
    }
    .blob-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #7c3aed, #ec4899);
      bottom: 80px; right: 120px;
      animation-delay: 6s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-24px) scale(1.06); }
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow:
        0 0 0 1px rgba(124,58,237,0.08),
        0 24px 64px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon svg { width: 32px; height: 32px; }
    .logo-text {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    /* Header */
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .header p {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Form */
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-secondary);
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-wrap:focus-within .input-icon { color: var(--accent); }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 44px 13px 42px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input::placeholder { color: var(--text-secondary); }

    .toggle-pass {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: var(--accent); }

    /* Remember / Forgot */
    .row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-size: 0.84rem;
      color: var(--text-muted);
      user-select: none;
    }
    .checkbox-label input[type="checkbox"] { display: none; }
    .custom-check {
      width: 17px; height: 17px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .checkbox-label input:checked + .custom-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .custom-check svg { display: none; }
    .checkbox-label input:checked + .custom-check svg { display: block; }

    .forgot {
      font-size: 0.84rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .forgot:hover { color: #a78bfa; text-decoration: underline; }

    /* Button */
    .btn-signin {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.25s;
      box-shadow: 0 4px 24px var(--accent-glow);
    }
    .btn-signin::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-signin:hover { transform: translateY(-1px); box-shadow: 0 8px 32px var(--accent-glow); }
    .btn-signin:hover::before { opacity: 1; }
    .btn-signin:active { transform: translateY(0); }

    /* Loading state */
    .btn-signin.loading {
      pointer-events: none;
    }
    .btn-signin.loading .btn-text { display: none; }
    .btn-signin .spinner { display: none; }
    .btn-signin.loading .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer note */
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Error message */
    .error-msg {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.84rem;
      color: #f87171;
      margin-bottom: 20px;
      text-align: center;
    }
    .error-msg.show { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 8C10 8 14 8 16 12C18 16 22 16 22 16" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M10 16C10 16 14 16 16 20C18 24 22 24 22 24" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="10" cy="8" r="2.5" fill="#7c3aed"/>
          <circle cx="22" cy="16" r="2.5" fill="#7c3aed"/>
          <circle cx="10" cy="16" r="2.5" fill="#a78bfa"/>
          <circle cx="22" cy="24" r="2.5" fill="#a78bfa"/>
        </svg>
      </div>
      <span class="logo-text">InfoLink</span>
    </div>

    <!-- Header -->
    <div class="header">
      <h1>Welcome back</h1>
      <p>Sign in with your organization credentials.</p>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">Invalid username or password. Please try again.</div>

    <!-- Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Toggle password">
            <svg id="eyeIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="row-meta">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" />
          <span class="custom-check">
            <svg width="10" height="10" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-signin" id="signInBtn">
        <span class="btn-text">Sign In</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="footer-note">Need access? Contact your system administrator.</p>
  </div>

  <script src="data-store.js"></script>
  <script>
    // Toggle password visibility
    const togglePass = document.getElementById('togglePass');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePass.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden
        ? `<path d="M17.94 17.94A10.06 10.06 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>`;
    });

    // Form submit
    const form = document.getElementById('loginForm');
    const btn  = document.getElementById('signInBtn');
    const err  = document.getElementById('errorMsg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      err.classList.remove('show');

      if (!user || !pass) {
        err.textContent = 'Please enter your username and password.';
        err.classList.add('show');
        return;
      }

      btn.classList.add('loading');

      setTimeout(() => {
        btn.classList.remove('loading');

        // System admin fallback (hardcoded)
        if (user.toLowerCase() === 'admin1' && pass === '123') {
          InfoLinkStore.setSession({ username: 'admin1', name: 'Admin', role: 'Admin', group: 'Management' });
          window.location.href = 'dashboard.html';
          return;
        }

        // Check stored users via centralized store
        const found = InfoLinkStore.findUserByCredentials(user, pass);

        if (found) {
          InfoLinkStore.setSession(found);
          const role = found.role.toLowerCase() === 'admin' ? 'admin' : 'user';
          window.location.href = role === 'admin' ? 'dashboard.html' : 'dashboard-user.html';
        } else {
          err.textContent = 'Invalid username or password. Please try again.';
          err.classList.add('show');
        }
      }, 1400);
    });
  </script>
</body>
</html>
