<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InfoLink – Change Password</title>
  <meta name="description" content="Change your InfoLink account password securely."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css"/>
  <style>
    .form-wrapper {
      max-width: 520px;
      margin: 0 auto;
    }
    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
    }
    .form-section-title {
      font-size: 0.95rem; font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .form-section-title svg { width: 20px; height: 20px; color: var(--accent); }

    .field-group { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
    .field-label {
      font-size: 0.8rem; font-weight: 600;
      color: var(--text-secondary); letter-spacing: 0.2px;
    }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: var(--text-secondary); pointer-events: none;
    }
    .field-input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text-primary); font-size: 0.86rem;
      font-family: 'Inter', sans-serif; padding: 11px 42px 11px 38px;
      outline: none; transition: border-color 0.18s, box-shadow 0.18s;
    }
    .field-input::placeholder { color: var(--text-secondary); }
    .field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .field-input.error { border-color: var(--danger); }

    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-secondary);
      cursor: pointer; padding: 4px; display: flex; align-items: center;
      transition: color 0.18s;
    }
    .toggle-pw:hover { color: var(--accent); }
    .toggle-pw svg { width: 15px; height: 15px; }

    /* Strength meter */
    .strength-bar {
      height: 4px; border-radius: 2px;
      background: var(--border); margin-top: 6px; overflow: hidden;
    }
    .strength-fill {
      height: 100%; border-radius: 2px;
      transition: width 0.3s, background 0.3s;
      width: 0%;
    }
    .strength-label {
      font-size: 0.72rem; color: var(--text-secondary); margin-top: 4px;
    }

    .requirements-list {
      margin: 14px 0;
      padding: 14px 16px;
      background: rgba(124,58,237,0.06);
      border: 1px solid rgba(124,58,237,0.15);
      border-radius: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .req-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; color: var(--text-secondary);
      transition: color 0.2s;
    }
    .req-item.met { color: var(--success); }
    .req-item svg { width: 13px; height: 13px; flex-shrink: 0; }

    .form-actions {
      display: flex; align-items: center; gap: 12px; margin-top: 24px;
    }

    /* Success message */
    .success-msg {
      display: none;
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px; padding: 12px 16px;
      font-size: 0.86rem; color: var(--success);
      margin-bottom: 18px; align-items: center; gap: 8px;
    }
    .success-msg.show { display: flex; animation: fadeIn 0.3s ease; }
    .success-msg svg { width: 16px; height: 16px; flex-shrink: 0; }

    .error-msg {
      display: none;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px; padding: 12px 16px;
      font-size: 0.86rem; color: var(--danger);
      margin-bottom: 18px;
    }
    .error-msg.show { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── SIDEBAR (built by JS based on role) ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M10 8C10 8 14 8 16 12C18 16 22 16 22 16" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M10 16C10 16 14 16 16 20C18 24 22 24 22 24" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="10" cy="8"  r="2.5" fill="#7c3aed"/>
        <circle cx="22" cy="16" r="2.5" fill="#7c3aed"/>
        <circle cx="10" cy="16" r="2.5" fill="#a78bfa"/>
        <circle cx="22" cy="24" r="2.5" fill="#a78bfa"/>
      </svg>
      <span class="sidebar-logo-text">InfoLink</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Injected by JS -->
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="sb-avatar">A</div>
      <div class="user-info">
        <div class="user-name" id="sb-name">Admin</div>
        <div class="user-role" id="sb-role">System Administrator</div>
      </div>
    </div>
    <div style="padding:0 14px 14px;">
      <button class="btn-logout" onclick="handleLogout()">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <div class="main">

    <header class="topbar">
      <div class="topbar-title">
        <h2>Change Password</h2>
        <p>Update your account password securely</p>
      </div>
      <div class="topbar-actions">
        <button class="theme-btn" title="Toggle theme">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <div class="profile-chip">
          <div class="avatar" id="top-avatar">A</div>
          <div>
            <div class="name" id="top-name">Admin</div>
            <div class="role" id="top-role">System Administrator</div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="form-wrapper">
        <div class="form-card">
          <div class="form-section-title">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            Change Password
          </div>

          <div class="success-msg" id="success-msg">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Password changed successfully!
          </div>
          <div class="error-msg" id="error-msg"></div>

          <!-- Current password -->
          <div class="field-group">
            <label class="field-label" for="current-password">Current password</label>
            <div class="input-wrap">
              <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
              <input id="current-password" type="password" class="field-input" placeholder="Enter current password"/>
              <button type="button" class="toggle-pw" onclick="toggleVis('current-password', this)">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- New password -->
          <div class="field-group">
            <label class="field-label" for="new-password">New password</label>
            <div class="input-wrap">
              <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
              <input id="new-password" type="password" class="field-input" placeholder="Enter new password" oninput="evalStrength(this.value)"/>
              <button type="button" class="toggle-pw" onclick="toggleVis('new-password', this)">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <!-- Strength bar -->
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <div class="strength-label" id="strength-label">Enter a new password</div>
          </div>

          <!-- Requirements -->
          <div class="requirements-list">
            <div class="req-item" id="req-len">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              At least 8 characters
            </div>
            <div class="req-item" id="req-upper">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              At least one uppercase letter
            </div>
            <div class="req-item" id="req-num">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              At least one number
            </div>
          </div>

          <!-- Confirm password -->
          <div class="field-group">
            <label class="field-label" for="confirm-password">Confirm new password</label>
            <div class="input-wrap">
              <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
              <input id="confirm-password" type="password" class="field-input" placeholder="Repeat new password"/>
              <button type="button" class="toggle-pw" onclick="toggleVis('confirm-password', this)">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-outline" id="btn-cancel" onclick="history.back()">Cancel</button>
            <button class="btn btn-primary" onclick="handleChangePassword()">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Change Password
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="data-store.js"></script>
<script>
  // Auth guard
  if (!InfoLinkStore.isLoggedIn()) {
    window.location.href = 'login.html';
  }

  const currentUser = InfoLinkStore.getCurrentUser();
  const isAdmin     = InfoLinkStore.isAdmin();
  const displayName = currentUser.fullname || currentUser.username || 'User';
  const displayRole = isAdmin ? 'System Administrator' : 'Standard User';
  const displayInit = displayName.charAt(0).toUpperCase();

  // Set user info
  document.getElementById('sb-avatar').textContent   = displayInit;
  document.getElementById('sb-name').textContent     = displayName;
  document.getElementById('sb-role').textContent     = displayRole;
  document.getElementById('top-avatar').textContent  = displayInit;
  document.getElementById('top-name').textContent    = displayName;
  document.getElementById('top-role').textContent    = displayRole;

  // Build adaptive sidebar nav
  const adminNav = `
    <div class="nav-section-label">Main</div>
    <a href="dashboard.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>Dashboard
    </a>
    <a href="search-admin.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>Search
    </a>
    <div class="nav-section-label">Management</div>
    <a href="users.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>Users
    </a>
    <a href="groups.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>Groups
    </a>
    <a href="logs.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>Logs
    </a>
    <div class="nav-section-label">Settings</div>
    <a href="change-password.html" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>Change Password
    </a>
  `;

  const userNav = `
    <div class="nav-section-label">Main</div>
    <a href="dashboard-user.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>Dashboard
    </a>
    <a href="search-user.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>Search
    </a>
    <div class="nav-section-label">Settings</div>
    <a href="change-password.html" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>Change Password
    </a>
  `;

  document.getElementById('sidebar-nav').innerHTML = isAdmin ? adminNav : userNav;

  function handleLogout() {
    InfoLinkStore.clearSession();
    window.location.href = 'login.html';
  }

  // Password visibility toggle
  function toggleVis(id, btn) {
    const inp = document.getElementById(id);
    const isHide = inp.type === 'password';
    inp.type = isHide ? 'text' : 'password';
    btn.innerHTML = isHide
      ? `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17.94 17.94A10.06 10.06 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
  }

  // Strength evaluator
  function evalStrength(val) {
    const fill  = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    setReq('req-len',   val.length >= 8);
    setReq('req-upper', /[A-Z]/.test(val));
    setReq('req-num',   /[0-9]/.test(val));

    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const configs = [
      { w: '0%',   bg: 'var(--border)',   text: 'Enter a new password' },
      { w: '25%',  bg: 'var(--danger)',   text: 'Weak' },
      { w: '50%',  bg: 'var(--warning)',  text: 'Fair' },
      { w: '75%',  bg: '#3b82f6',         text: 'Good' },
      { w: '100%', bg: 'var(--success)',  text: 'Strong' },
    ];
    const c = configs[val.length === 0 ? 0 : score];
    fill.style.width      = c.w;
    fill.style.background = c.bg;
    label.textContent     = c.text;
    label.style.color     = val.length === 0 ? 'var(--text-secondary)' : c.bg;
  }

  function setReq(id, met) {
    const el = document.getElementById(id);
    el.classList.toggle('met', met);
    el.querySelector('svg').innerHTML = met
      ? `<polyline points="20 6 9 17 4 12" stroke="var(--success)" stroke-width="2.5"/>`
      : `<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>`;
  }

  function handleChangePassword() {
    const curr    = document.getElementById('current-password').value;
    const newPw   = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    const errEl   = document.getElementById('error-msg');
    const sucEl   = document.getElementById('success-msg');

    errEl.classList.remove('show');
    sucEl.classList.remove('show');

    if (!curr || !newPw || !confirm) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.classList.add('show');
      return;
    }

    // Verify current password
    const users = InfoLinkStore.getUsers();
    const uIdx  = users.findIndex(u => u.username === currentUser.username);

    let currentPwOk = false;
    if (currentUser.username === 'admin1' && curr === '123') {
      currentPwOk = true; // system admin fallback
    } else if (uIdx >= 0 && users[uIdx].password === curr) {
      currentPwOk = true;
    }

    if (!currentPwOk) {
      errEl.textContent = 'Current password is incorrect.';
      errEl.classList.add('show');
      return;
    }

    if (newPw.length < 8) {
      errEl.textContent = 'New password must be at least 8 characters.';
      errEl.classList.add('show');
      return;
    }

    if (newPw !== confirm) {
      errEl.textContent = 'Passwords do not match.';
      errEl.classList.add('show');
      return;
    }

    // Save
    if (uIdx >= 0) {
      users[uIdx].password = newPw;
      InfoLinkStore.saveUsers(users);
    }

    document.getElementById('current-password').value = '';
    document.getElementById('new-password').value     = '';
    document.getElementById('confirm-password').value = '';
    evalStrength('');
    sucEl.classList.add('show');
  }
</script>
</body>
</html>
